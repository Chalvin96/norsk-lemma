[project]
name = "norsk-lemma"
version = "1.2.0"
description = "Pipeline for generating English lemma glosses from Ordbokene Bokmål data."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "nb-g2p>=2.1.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "tqdm>=4.70.0",
]

[tool.uv]
package = false

[dependency-groups]
audio = [
    "google-cloud-texttospeech>=2.37.0",
    "google-genai>=2.22.0,<3.0.0",
    "boto3>=1.43.89",
]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
